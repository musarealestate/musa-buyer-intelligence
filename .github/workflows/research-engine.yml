name: MUSA Buyer Research Engine

"on":
  workflow_dispatch:

permissions:
  contents: read

jobs:
  research:
    name: Public Buyer Research
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Run MUSA Research
        run: python engine/search_sources.py
